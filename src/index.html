<body>
    <style>
* {text-align: center}
body { background: black; color: white; font-family: sans-serif; }
canvas {height: 97vh; aspect-ratio: 1 / 1; text-align: center;}
div {text-align: center;}


</style>

    <h3 hidden id="endText"></h3>
    <div id=startPage>
        <button autofocus id=startButton>I'm ready!</button>
    </div>







    <canvas id=canvas height=500 width=500 style="border: 2px solid white">
    </canvas>
    <script>
        function getRandomInt(max) {
            return Math.floor(Math.random() * max);
        }
        function playingFieldInit(w, h) {
            var field = [];
            for (var y = 0; y < h; y++) {
                field[y] = [];
                for (var x = 0; x < w; x++) {
                    field[y][x] = 0;
                }
            }
            return field;
        }
        function drawField(canvas, field, squareSize) {
            for (var y = 0; y < field.length; y++) {
                for (var x = 0; x < field[y].length; x++) {
                    canvas.fillStyle = "rgb(200 0 0 / 30%)";
                    canvas.fillRect(x * squareSize, y * squareSize, squareSize - 1, squareSize - 1);
                }
            }
        }
        function newPlayer(x, y, velocity, tailLen, controls, colors, name) {
            const tail = [];
            for (var i = 0; i < tailLen; i++) {
                tail[i] = {x: x, y: y};
            }
            const p = {
                x: Math.floor(x),
                y: Math.floor(y),
                v: velocity,
                d: 0,
                t: tail,
                c: controls,
                cc: colors,
                m: false, //not moved
                k: false, //turned this turn
                q: name,
            };
            return p;
        }
        function movePlayer(p) {
            switch(p.d) { // 90 direction turn, clockwise
                case 0:
                    p.y -= 1;
                    break;
                case 1:
                    p.x += 1;
                    break;
                case 2:
                    p.y += 1;
                    break;
                case 3:
                    p.x -= 1;
                    break;
            }
            p.t[0].m = true;
            p.t.push(p.t.shift()); //move last tail square to first
            p.t[0].m = false;
            p.t[0].x = p.x;
            p.t[0].y = p.y;
            p.k = false;

        }
        function checkMove(p, fruits) {
            if (p.x < 0 || p.y < 0 || p.x > playingFieldSize || p.y > playingFieldSize) {
                endGame(`${p.q} is out of bounds`);
            }
                for (var i = 0; i < fruits.length; i++) {
                    if (fruits[i].x == p.x && fruits[i].y == p.y) {
                    p.t.push({x: p.x, y: p.y});
                    p.t.push({x: p.x, y: p.y});
                    p.t.push({x: p.x, y: p.y});
                    p.t.push({x: p.x, y: p.y});
                    p.t.push({x: p.x, y: p.y});
                    p.t.push({x: p.x, y: p.y});
                    p.t.push({x: p.x, y: p.y});
                    p.t.push({x: p.x, y: p.y});
                    p.t.push({x: p.x, y: p.y});
                    p.t.push({x: p.x, y: p.y});
                    p.t.push({x: p.x, y: p.y});
                    fruits.splice(i, 1);
                }
            }
            for (var i = 0; i < players.length; i++) {
                var opponent = players[i];
                for (var j = 0; j < opponent.t.length; j++) {
                    if (opponent.t[j].m == true) { // make suer the segment hasnt been just made
                        if (opponent.t[j].x == p.x && opponent.t[j].y == p.y) {
                            endGame(`${p.q} got slithered, ${opponent.q} won`);
                        }
                    }
                }
            }
        }
        function drawPlayer(canvas, p, squareSize) {
            canvas.fillStyle = p.cc.tail;

            for (var i = 0; i < p.t.length; i++) {
                canvas.fillRect(p.t[i].x * squareSize, p.t[i].y * squareSize, squareSize, squareSize);
            }
            canvas.fillStyle = p.cc.head;
            canvas.fillRect(p.x * squareSize, p.y * squareSize, squareSize, squareSize);
        }
        function newFruit(fruits, fieldSideSize) {
            fruits.push({x:getRandomInt(fieldSideSize), y:getRandomInt(fieldSideSize)});
            //console.log(fruits[fruits.length - 1].x, fruits[fruits.length - 1].y);
        }
        function endGame(text){
            var h4 = document.getElementById("endText");
            h4.textContent = `Game Over: ${text}`;
            h4.hidden = false;
            console.log(text);
            cancelAnimationFrame(window.requestAnimationFrame());

        }


        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        canvas.hidden = true;


        const startButton = document.getElementById("startButton");
        startButton.addEventListener("click", (event) => {
            var startPage = document.getElementById("startPage");
            startPage.hidden = true;
            canvas.hidden = false;
            requestAnimationFrame(main);
        });

        document.addEventListener("keydown", function(event) {

            for (var i = 0; i < players.length; i++) {
                var player = players[i];

                for (var j = 0; j < player.c.length; j++) {
                    if (event.key == player.c[j] && player.k == false) {
                        if ((j - 2 + 4) % 4 != player.d) { // make sure the snake doesnt make an istant u turn
                            player.d = j;
                            player.k = true;
                        }
                    }
                }
            }
        });
        function clear(canvas, field, squareSize) {

            canvas.fillStyle = "rgb(0 0 0)";
            canvas.fillRect(0, 0, 500, 500);
            drawField(canvas, field, squareSize);
            drawFruit(canvas, fruits, squareSize);
            for (var i = 0; i < players.length; i++) {
                drawPlayer(ctx, players[i], squareSize);
            }
        }
        function drawFruit(canvas, fruit, squareSize) {
            for (var i = 0; i < fruit.length; i++) {
                //console.log(fruit[i]);
                canvas.fillStyle = "rgb(100 0 100)";
                canvas.fillRect(fruit[i].x * squareSize, fruit[i].y * squareSize, squareSize, squareSize);

            }
        }



        let playingFieldSize = 50;
        var canvasSize = 500;
        var squareSize = canvasSize / playingFieldSize;
        var squareFieldSize = canvasSize / squareSize;
        let wrapAround = false;
        let field = playingFieldInit(squareFieldSize , squareFieldSize);
        let players = [];
        let colors = []
        colors.push( {
            red: ["rgb(120 0 0)", "rgb(200 0 0)",],
            blue: ["rgb(0 0 120)", "rgb(0 0 200)"],
            green: ["rgb(0 120 0)", "rgb(0 200 0)"],
        });
        //players.push(Math.floor(playingFieldSize / 4), Math.floor(playingFieldSize * .8), length, controls, {head: colors[0], tail: colors[1]});
        /*
        newPlayer(0.1, 5, ["ArrowUp", "ArrowRight", "ArrowDown", "ArrowLeft"], colors.red);
        newPlayer(0.1, 5, ["w", "a", "s", "d"], colors.red);
        */
        players.push(newPlayer(Math.floor(playingFieldSize / 4 * 3), Math.floor(playingFieldSize * .8), 0.1, 10, ["ArrowUp", "ArrowRight", "ArrowDown", "ArrowLeft"], {tail: "rgb(0 120 0)", head: "rgb(0 200 0)"}, "green"));
        players.push(newPlayer(playingFieldSize / 4, playingFieldSize * .8, 0.1, 10, ["w", "d", "s", "a"], {tail: "rgb(0 0 120)", head: "rgb(0 0 200)"}, "blue"));
        let opponent = newPlayer(30, 30, 0.1, 10);
        let fruits = [];
        let startTime;
        let time;
        let newFruitTimer = 0;

        function main(callTime) {
            startTime = startTime || callTime;
            clear(ctx, field, squareSize);

            time = (callTime - startTime) / 1000;

            for (var i = 0; i < players.length; i++) {
                var player = players[i];
                if (time > player.v) {

                    startTime = callTime;
                    checkMove(player, fruits);
                    movePlayer(player);
                }
            }
            newFruitTimer += 1;
            if (newFruitTimer >= 30) {
                newFruit(fruits, squareFieldSize);
                newFruitTimer = 0;
            }
            requestAnimationFrame(main);
        };







    </script>
